<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Management - Interfinix</title>
    <link rel="stylesheet" href="questions.css">
</head>

<body>

    <header>
        <nav>
            <h2>INTERFINIX</h2>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>

        <h1>Question Management System</h1>

        <p>
            Assigned Domain:
            <span id="domainName">Domain ID: 1 (Testing)</span>
        </p>

        <section>

            <h2>Add / Update Question</h2>

            <form id="questionForm">

                <label>Difficulty Level</label>

                <select id="difficultyLevel" required>
                    <option value="">Select Difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>

                <label>Question Type</label>

                <select id="questionType" required>
                    <option value="">Select Type</option>
                    <option value="MCQ">MCQ</option>
                    <option value="Subjective">Subjective</option>
                </select>

                <label>Enter Question</label>

                <textarea id="questionText"
                    rows="4"
                    placeholder="Enter your question"
                    required></textarea>

                <button type="submit" id="addButton">
                    Add Question
                </button>

                <button type="button" id="updateButton"
                    style="display: none;">
                    Update Question
                </button>

                <button type="reset" id="resetButton">
                    Reset
                </button>

            </form>

        </section>

        <section>

            <h2>All Questions</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Question</th>
                        <th>Difficulty</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="questionTable">
                </tbody>

            </table>

        </section>

    </main>

    <script src="questions.js"></script>

</body>
</html>
