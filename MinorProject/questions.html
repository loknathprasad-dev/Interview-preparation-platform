<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Questions – Interfinix</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-dot"></div>
        INTERFINIX
      </a>
      <div class="nav-links" style="display:flex;">
        <a href="faculty.html">Dashboard</a>
        <span class="admin-badge">Faculty</span>
        <a href="#" id="logoutBtn" class="nav-cta">Log Out</a>
      </div>
    </div>
  </nav>

  <section class="admin-section">
    <div class="admin-wrap">

      <h1 class="admin-title">Manage Questions</h1>
      <p class="admin-sub" id="domainLine">Loading your domain...</p>

      <div class="admin-card" id="formCard" style="display:none;">
        <h2 class="admin-card-title" id="formTitle">Add New Question</h2>
        <form id="qForm">
          <label for="qText" style="display:block; font-size:.85rem; font-weight:600; margin-bottom:.35rem;">Question</label>
          <textarea id="qText" required placeholder="Type the interview question here"
            style="width:100%; min-height:100px; font-family:inherit; font-size:.95rem; padding:.75rem .9rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); outline:none; margin-bottom:1rem;"></textarea>

          <div id="statusRow" style="display:none; margin-bottom:1rem;">
            <label for="qStatus" style="display:block; font-size:.85rem; font-weight:600; margin-bottom:.35rem;">Status</label>
            <select id="qStatus"
              style="font-family:inherit; font-size:.95rem; padding:.6rem .9rem; border:1px solid var(--line); border-radius:8px; background:var(--bg);">
              <option value="ACTIVE">Active (students can see it)</option>
              <option value="INACTIVE">Inactive (hidden from students)</option>
            </select>
          </div>

          <button type="submit" class="auth-btn" id="saveBtn" style="width:auto; padding:.8rem 1.6rem;">Add Question</button>
          <button type="button" class="del-btn" id="cancelEdit" style="display:none; margin-left:.6rem;">Cancel</button>
        </form>
        <p class="auth-msg" id="adminMsg" style="margin-top:1rem; margin-bottom:0;"></p>
      </div>

      <div class="admin-card">
        <h2 class="admin-card-title">All Questions</h2>
        <div class="table-scroll">
          <table class="faculty-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Question</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="qBody">
              <tr><td colspan="4" class="empty-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </section>

  <script src="questions.js"></script>
</body>

</html>
