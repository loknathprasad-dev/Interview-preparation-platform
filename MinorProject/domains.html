<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Domains – Interfinix</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-dot"></div>
        INTERFINIX
      </a>
      <div class="nav-links" style="display:flex;">
        <a href="admin.html">Faculty</a>
        <a href="domains.html">Domains</a>
        <span class="admin-badge">Admin Panel</span>
        <a href="#" id="logoutBtn" class="nav-cta">Log Out</a>
      </div>
    </div>
  </nav>

  <section class="admin-section">
    <div class="admin-wrap">

      <h1 class="admin-title">Manage Domains</h1>
      <p class="admin-sub">Add, edit or remove the job domains students can practise.</p>

      <div class="admin-card">
        <h2 class="admin-card-title" id="formTitle">Add New Domain</h2>
        <form id="domainForm" class="faculty-form">
          <div>
            <label for="dName">Domain Name</label>
            <input type="text" id="dName" placeholder="e.g. Web Development" required />
          </div>
          <div style="grid-column: span 2;">
            <label for="dDesc">Description</label>
            <input type="text" id="dDesc" placeholder="Short description" />
          </div>
          <button type="submit" class="auth-btn" id="saveBtn">Add Domain</button>
        </form>
        <p class="auth-msg" id="adminMsg"></p>
      </div>

      <div class="admin-card">
        <h2 class="admin-card-title">All Domains</h2>
        <div class="table-scroll">
          <table class="faculty-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Description</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="domainBody">
              <tr><td colspan="4" class="empty-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </section>

  <script src="domains.js"></script>
</body>

</html>
