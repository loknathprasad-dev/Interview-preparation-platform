<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Result</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #4C1D95 0%, #6D28D9 45%, #7C3AED 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .result-card {
    background: rgba(255,255,255,.97);
    max-width: 460px;
    width: 100%;
    border-radius: 24px;
    padding: 40px 36px 34px;
    box-shadow: 0 25px 60px rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.4);
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .result-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #7C3AED, #22D3EE);
  }

  .icon-badge {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, #5B21B6, #7C3AED);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin: 0 auto 16px;
    box-shadow: 0 10px 25px rgba(124,58,237,.35);
  }

  .result-title { font-size: 1.4rem; font-weight: 900; color: #18103A; margin-bottom: 4px; }
  .result-tag {
    font-size: .8rem; font-weight: 700; color: #7C3AED;
    letter-spacing: .5px; text-transform: uppercase; margin-bottom: 26px;
  }

  .score-ring {
    width: 160px; height: 160px; border-radius: 50%;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    background: conic-gradient(#22D3EE 0deg, #22D3EE calc(var(--pct) * 3.6deg), #EDE9FE calc(var(--pct) * 3.6deg));
  }
  .score-ring::after {
    content: "";
    position: absolute; inset: 12px;
    background: #fff; border-radius: 50%;
  }
  .score-value {
    position: relative; z-index: 1;
    font-size: 2.1rem; font-weight: 900; color: #5B21B6;
  }
  .score-value span { display: block; font-size: .7rem; font-weight: 700; color: #9CA3AF; margin-top: 2px; letter-spacing: .5px; }

  .stat-row {
    display: flex; justify-content: center; gap: 10px;
    margin-bottom: 28px; flex-wrap: wrap;
  }
  .stat-chip {
    background: #EDE9FE; color: #5B21B6; font-weight: 700; font-size: .82rem;
    padding: 8px 16px; border-radius: 50px; display: flex; align-items: center; gap: 6px;
  }
  .stat-chip.correct { background: #D1FAE5; color: #047857; }
  .stat-chip.total { background: #EDE9FE; color: #5B21B6; }

  .status-msg {
    color: #6B7280; font-size: .9rem; font-weight: 600; padding: 30px 0;
  }
  .status-msg.error { color: #DC2626; }

  .btn-row { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  button, .btn-link {
    border: none; padding: 14px 20px; font-size: .95rem; border-radius: 14px;
    cursor: pointer; font-weight: 800; text-decoration: none; display: flex;
    align-items: center; justify-content: center; gap: 8px; transition: all .2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #059669, #10B981); color: white;
    box-shadow: 0 10px 25px rgba(5,150,105,.35);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(5,150,105,.45); }
  .btn-secondary {
    background: #F5F3FF; color: #6D28D9; border: 1.5px solid #DDD6FE;
  }
  .btn-secondary:hover { background: #EDE9FE; transform: translateY(-2px); }

  @media (max-width: 480px) {
    .result-card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>
  <div class="result-card">
    <div class="icon-badge">🏆</div>
    <h1 class="result-title">Your Result</h1>
    <p class="result-tag">Java Interview Practice</p>

    <div id="status" class="status-msg">Loading your result...</div>

    <div id="resultBox" style="display:none;">
      <div class="score-ring" id="scoreRing" style="--pct:0;">
        <div class="score-value" id="scoreValue">0%<span>SCORE</span></div>
      </div>
      <div class="stat-row">
        <span class="stat-chip total" id="totalChip">📝 Total: 0</span>
        <span class="stat-chip correct" id="correctChip">✅ Correct: 0</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="loadResult()">🔄 Refresh Result</button>
      <a href="main.html" class="btn-link btn-secondary">🏠 Back to Home</a>
    </div>
  </div>

<script>
const API_BASE = "http://localhost:8081/api";
const studentName = localStorage.getItem('studentName');

function loadResult() {
  const status = document.getElementById('status');
  status.className = 'status-msg';
  status.innerText = "Loading your result...";
  document.getElementById('resultBox').style.display = 'none';

  fetch(`${API_BASE}/results/calculate?studentName=${encodeURIComponent(studentName)}`, {
    method: 'POST'
  })
  .then(res => res.json())
  .then(data => {
    status.innerText = "";
    document.getElementById('resultBox').style.display = 'block';

    const pct = Math.round(data.score);
    document.getElementById('scoreRing').style.setProperty('--pct', pct);
    document.getElementById('scoreValue').innerHTML = `${data.score.toFixed(0)}%<span>SCORE</span>`;
    document.getElementById('totalChip').innerText = `📝 Total: ${data.totalQuestions}`;
    document.getElementById('correctChip').innerText = `✅ Correct: ${data.correctAnswers}`;
  })
  .catch(() => {
    status.className = 'status-msg error';
    status.innerText = "⚠️ Faculty ne abhi review nahi kiya, thodi der baad try karein.";
  });
}

loadResult();
</script>
</body>
</html>
