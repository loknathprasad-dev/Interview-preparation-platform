<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Answers Review | Faculty Portal MIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --p1: #5B21B6; --p2: #7C3AED; --p3: #8B5CF6; --p-pale: #EDE9FE;
      --bg-gradient: linear-gradient(135deg, #4C1D95 0%, #6D28D9 45%, #7C3AED 100%);
      --ink: #18103A; --muted: #5B6278; --subtle: #9CA3AF;
      --r8: 8px; --r12: 12px; --r16: 16px; --r24: 24px; --r32: 32px;
      --s3: 0 20px 60px rgba(0,0,0,.25);
      --ease: cubic-bezier(.4, 0, .2, 1);
      --fast: .22s var(--ease);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    nav {
      position: sticky; top: 0; z-index: 300;
      background: linear-gradient(90deg, #3B0F8C 0%, #6D28D9 50%, #7C3AED 100%);
      height: 64px; display: flex; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      padding: 0 4%;
    }
    .nav-inner {
      width: 100%; max-width: 1300px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-left { display: flex; align-items: center; gap: 1.2rem; }
    .nav-logo { font-size: 1.35rem; font-weight: 900; color: #fff; letter-spacing: 1.5px; display: flex; align-items: center; gap: .6rem; }
    .badge-faculty {
      background: rgba(34, 211, 238, 0.2); border: 1px solid #22D3EE; color: #22D3EE;
      font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: 50px; text-transform: uppercase;
    }
    .nav-links-left { display: flex; align-items: center; gap: 1.8rem; margin-left: 1.5rem; }
    .nav-links-left a { color: rgba(255,255,255,.85); font-size: .92rem; font-weight: 600; }
    .nav-links-left a:hover, .nav-links-left a.active { color: #FFFFFF; }
    .nav-right a { color: rgba(255,255,255,.85); font-size: .92rem; font-weight: 600; }

    .main-wrapper {
      flex: 1; padding: 2.5rem 4% 5rem; max-width: 1000px; margin: 0 auto; width: 100%;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: .5rem; color: #EDE9FE;
      font-weight: 700; font-size: .9rem; margin-bottom: 1.5rem;
      background: rgba(255,255,255,.1); padding: .4rem 1rem; border-radius: 50px;
      border: none; cursor: pointer;
    }
    .back-link:hover { background: rgba(255,255,255,.2); color: #fff; }

    .submissions-container {
      background: #FFFFFF; border-radius: var(--r24); padding: 2.5rem; box-shadow: var(--s3);
    }
    .submissions-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .submissions-title { font-size: 1.4rem; font-weight: 900; color: var(--ink); }
    .badge-count { background: #EDE9FE; color: var(--p1); font-weight: 800; padding: .3rem .8rem; border-radius: 50px; font-size: .85rem; }

    .sub-item {
      background: #F9FAFB; border: 1.5px solid #E5E7EB; border-radius: var(--r16);
      padding: 1.6rem; margin-bottom: 1.5rem; transition: border-color var(--fast);
    }
    .sub-item:hover { border-color: #A78BFA; }
    .sub-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; flex-wrap: wrap; gap: .5rem; }
    .sub-student { font-weight: 800; font-size: 1rem; color: var(--p1); display: flex; align-items: center; gap: .5rem; }
    .sub-time { font-size: .8rem; color: var(--subtle); font-weight: 600; }
    .sub-question { font-size: 1.05rem; font-weight: 800; color: var(--ink); margin-bottom: .6rem; }
    .sub-student-answer {
      background: #EFF6FF; border-left: 4px solid #3B82F6; padding: 1rem; border-radius: 0 var(--r8) var(--r8) 0;
      font-size: .92rem; color: #1E293B; line-height: 1.6; margin-bottom: 1.2rem;
    }
    .faculty-feedback-box { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-grade { color: #fff; border: none; padding: .75rem 1.4rem; border-radius: var(--r12); font-weight: 800; cursor: pointer; transition: all var(--fast); }
    .btn-right { background: linear-gradient(135deg, #059669, #10B981); }
    .btn-right:hover { transform: translateY(-2px); background: #047857; }
    .btn-wrong { background: linear-gradient(135deg, #DC2626, #EF4444); }
    .btn-wrong:hover { transform: translateY(-2px); background: #B91C1C; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: .8rem; }

    @media (max-width: 600px) {
      .submissions-container { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <a href="faculty.html" class="nav-logo">
          <div style="width:8px;height:8px;border-radius:50%;background:#22D3EE;"></div>
          INTERFINIX <span class="badge-faculty">Faculty</span>
        </a>
        <div class="nav-links-left">
          <a href="faculty.html">Faculty Home</a>
          <a href="addQs.html">Add Questions</a>
          <a href="ansQs.html" class="active">Answer Questions</a>
          <a href="ansquery.html">Student Queries</a>
        </div>
      </div>
      <div class="nav-right">
        <a href="faculty.html">&larr; Back to Hub</a>
      </div>
    </div>
  </nav>

  <main class="main-wrapper">
    <a href="ansQs.html" class="back-link">&larr; Back to Field Selection</a>

    <div class="submissions-container">
      <div class="submissions-header">
        <h2 class="submissions-title">Student Submissions for <span style="color:#7C3AED;">Java Developer</span></h2>
        <span class="badge-count" id="pendingCountBadge">Loading...</span>
      </div>

      <div id="submissionsList">
        <div class="empty-state"><p>Loading submissions...</p></div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "http://localhost:8081/api";
    let questionMap = {};

    function loadQuestionMap() {
      return fetch(`${API_BASE}/questions/java`)
        .then(res => res.json())
        .then(data => {
          questionMap = {};
          data.forEach(q => { questionMap[q.id] = q.questionText; });
        });
    }

    function loadJavaSubmissions() {
      const container = document.getElementById('submissionsList');
      container.innerHTML = `<div class="empty-state"><p>Loading submissions...</p></div>`;

      loadQuestionMap().then(() => {
        return fetch(`${API_BASE}/answers/pending`);
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('pendingCountBadge').textContent = `${data.length} Submissions Pending`;

        if (data.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🎉</div>
              <h3>All Caught Up!</h3>
              <p>No pending student submissions to review right now.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="sub-item" id="item-${item.id}">
            <div class="sub-meta">
              <div class="sub-student"><span>👨‍🎓</span> ${item.studentName}</div>
              <div class="sub-time">${item.submittedAt ? new Date(item.submittedAt).toLocaleString() : ''}</div>
            </div>
            <div class="sub-question">Q: ${questionMap[item.questionId] || ('Question #' + item.questionId)}</div>
            <div class="sub-student-answer"><strong>Student's Response:</strong><br/>${item.answerText || '(no answer given)'}</div>
            <div class="faculty-feedback-box">
              <button class="btn-grade btn-right" onclick="markStatus(${item.id}, 'right')">✅ Right</button>
              <button class="btn-grade btn-wrong" onclick="markStatus(${item.id}, 'wrong')">❌ Wrong</button>
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Backend se connect nahi ho paya</h3>
            <p>Check kar backend chal raha hai (http://localhost:8081)</p>
          </div>
        `;
      });
    }

    function markStatus(id, status) {
      fetch(`${API_BASE}/answers/${id}/status?status=${status}`, {
        method: 'PUT'
      }).then(() => {
        const item = document.getElementById(`item-${id}`);
        if (item) {
          item.style.transition = 'all .4s ease';
          item.style.opacity = '0';
          item.style.transform = 'translateY(-10px)';
          setTimeout(() => {
            item.remove();
            const remaining = document.querySelectorAll('.sub-item').length;
            document.getElementById('pendingCountBadge').textContent = `${remaining} Submissions Pending`;
            if (remaining === 0) {
              document.getElementById('submissionsList').innerHTML = `
                <div class="empty-state">
                  <div class="empty-state-icon">🎉</div>
                  <h3>All Caught Up!</h3>
                  <p>No pending student submissions to review right now.</p>
                </div>
              `;
            }
          }, 400);
        }
      });
    }

    loadJavaSubmissions();
  </script>
</body>
</html>
