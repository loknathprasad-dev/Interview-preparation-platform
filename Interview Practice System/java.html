<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Interview Questions</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #4C1D95 0%, #6D28D9 45%, #7C3AED 100%);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px 60px;
  }

  .top-bar {
    max-width: 700px; margin: 0 auto 25px;
    color: #fff; text-align: center;
  }
  .top-bar h1 {
    font-size: 1.7rem; font-weight: 800; margin-bottom: 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.2);
  }
  .top-bar p { font-size: .9rem; opacity: .85; margin-bottom: 16px; }

  .progress-wrap {
    background: rgba(255,255,255,.2); border-radius: 50px; height: 10px;
    max-width: 500px; margin: 0 auto; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; background: linear-gradient(90deg,#22D3EE,#06B6D4);
    border-radius: 50px; transition: width .3s ease;
  }
  .progress-label { color: #EDE9FE; font-size: .8rem; margin-top: 6px; font-weight: 600; }

  .card {
    background: #fff;
    max-width: 650px;
    margin: 18px auto;
    padding: 22px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    border: 1px solid rgba(255,255,255,.4);
    transition: transform .2s ease;
  }
  .card:hover { transform: translateY(-3px); }

  .q-badge {
    display: inline-block;
    background: #EDE9FE;
    color: #5B21B6;
    font-weight: 800;
    font-size: .78rem;
    padding: 4px 12px;
    border-radius: 50px;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 1.05rem;
    font-weight: 700;
    color: #18103A;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #E5E7EB;
    font-family: inherit;
    font-size: .92rem;
    resize: vertical;
    min-height: 90px;
    transition: border-color .2s;
  }
  textarea:focus {
    outline: none;
    border-color: #7C3AED;
    box-shadow: 0 0 0 3px rgba(124,58,237,.15);
  }

  .submit-wrap { max-width: 650px; margin: 30px auto 0; text-align: center; }
  button.submit-btn {
    background: linear-gradient(135deg, #059669, #10B981);
    color: white;
    border: none;
    padding: 14px 36px;
    font-size: 1rem;
    font-weight: 800;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(5,150,105,.35);
    transition: all .2s ease;
  }
  button.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(5,150,105,.45); }
  button.submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .loading-state {
    color: #EDE9FE; text-align: center; font-weight: 600; padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>☕ Java Interview Questions</h1>
    <p>The more you answer ,the more the progress bar grows.</p>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-label" id="progressLabel">0 of 0 answered</div>
  </div>

  <div id="questionsContainer">
    <div class="loading-state">Questions are loading...</div>
  </div>

  <div class="submit-wrap">
    <button class="submit-btn" id="submitBtn" onclick="submitAll()">Submit All Answers</button>
  </div>

<script>
const API_BASE = "http://localhost:8081/api";
const studentName = localStorage.getItem('studentName');
let questions = [];

if (!studentName) {
  alert("Pehle javadev.html se apna naam daalein");
  window.location.href = 'javadev.html';
}

fetch(`${API_BASE}/questions/java`)
  .then(res => res.json())
  .then(data => {
    questions = data;
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    questions.forEach((q, index) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <span class="q-badge">Question ${index + 1} of ${questions.length}</span>
        <p class="q-text">${q.questionText}</p>
        <textarea id="answer_${q.id}" placeholder="Answer here..." oninput="updateProgress()"></textarea>
      `;
      container.appendChild(div);
    });
    document.getElementById('progressLabel').innerText = `0 of ${questions.length} answered`;
  })
  .catch(() => {
    document.getElementById('questionsContainer').innerHTML =
      '<div class="loading-state">⚠️ Questions are not loading, please check out the backend.</div>';
  });

function updateProgress() {
  let answered = 0;
  questions.forEach(q => {
    const val = document.getElementById(`answer_${q.id}`).value.trim();
    if (val.length > 0) answered++;
  });
  const percent = questions.length ? (answered / questions.length) * 100 : 0;
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').innerText = `${answered} of ${questions.length} answered`;
}

function submitAll() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = 'Submitting...';

  const promises = questions.map(q => {
    const answerText = document.getElementById(`answer_${q.id}`).value;
    return fetch(`${API_BASE}/answers`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentName: studentName,
        questionId: q.id,
        answerText: answerText
      })
    });
  });

  Promise.all(promises).then(() => {
    alert("All answers are submitted. Now wait for the faculty to review.");
    window.location.href = 'result.html';
  }).catch(() => {
    alert("An error occured please try again.");
    btn.disabled = false;
    btn.innerText = 'Submit All Answers';
  });
}
</script>
</body>
</html>
