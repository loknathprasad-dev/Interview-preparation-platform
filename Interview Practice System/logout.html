<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Logged out from Interfinix – Your interview practice session has ended safely." />
  <title>Logged Out – Interfinix</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS & RESET
    ============================================================ */
    :root {
      --p1: #5B21B6; --p2: #7C3AED; --p3: #8B5CF6;
      --c1: #0891B2; --c2: #06B6D4; --c3: #22D3EE;
      --pink: #DB2777; --amber: #D97706; --green: #059669; --red: #EF4444;
      --bg: #F4F1FD; --surface: #FFFFFF;
      --ink: #18103A; --muted: #5B6278; --subtle: #9CA3AF;
      --r8: 8px; --r12: 12px; --r16: 16px; --r20: 20px; --r24: 24px; --r32: 32px;
      --s1: 0 2px 8px rgba(91,33,182,.07);
      --s2: 0 8px 24px rgba(91,33,182,.12);
      --s3: 0 20px 60px rgba(91,33,182,.22);
      --ease: cubic-bezier(.4, 0, .2, 1);
      --fast: .22s var(--ease); --mid: .38s var(--ease);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* ============================================================
       NAVBAR
    ============================================================ */
    nav {
      position: sticky; top: 0; z-index: 300;
      background: linear-gradient(110deg, #2D0A6A 0%, #5B21B6 45%, #6D28D9 75%, #7C3AED 100%);
      height: 64px; display: flex; align-items: center;
      box-shadow: 0 2px 20px rgba(45,10,106,.5);
    }
    .nav-inner {
      width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 5%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: 1.38rem; font-weight: 900; color: #fff; letter-spacing: 2.5px;
      display: flex; align-items: center; gap: .55rem;
    }
    .nav-logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, var(--c2), var(--c3));
      box-shadow: 0 0 8px rgba(6,182,212,.8);
    }
    .nav-links { display: flex; align-items: center; gap: 2rem; }
    .nav-links a { color: rgba(255,255,255,.78); font-weight: 500; font-size: .9rem; transition: color var(--fast); }
    .nav-links a:hover { color: #fff; }
    .nav-cta {
      background: linear-gradient(135deg, var(--c1), var(--c2)) !important;
      color: #fff !important; font-weight: 700 !important;
      padding: .48rem 1.4rem; border-radius: 50px;
      box-shadow: 0 4px 16px rgba(6,182,212,.45);
      transition: transform var(--fast), box-shadow var(--fast) !important;
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,182,212,.6) !important; }

    /* ============================================================
       LOGOUT CONTAINER & CARD
    ============================================================ */
    .logout-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 5%;
      position: relative;
    }

    /* Ambient Orbs */
    .bg-orb {
      position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(124, 58, 237, 0.16); top: 10%; left: 10%; }
    .orb-2 { width: 360px; height: 360px; background: rgba(6, 182, 212, 0.15); bottom: 10%; right: 10%; }

    .logout-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 580px;
      background: var(--surface);
      border-radius: var(--r32);
      box-shadow: var(--s3);
      padding: 3.5rem 3rem;
      text-align: center;
      border: 1px solid rgba(124, 58, 237, 0.12);
      animation: popIn .45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    .logout-icon {
      width: 86px; height: 86px; border-radius: 50%;
      background: linear-gradient(135deg, #EDE9FE, #DDD6FE);
      color: var(--p2); font-size: 2.8rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem; box-shadow: var(--s1);
    }

    .logout-title {
      font-size: 1.85rem; font-weight: 900; color: var(--ink); margin-bottom: .5rem;
    }
    .logout-subtitle {
      font-size: .95rem; color: var(--muted); line-height: 1.7; margin-bottom: 2rem;
    }

    /* Session Summary Box */
    .session-box {
      background: #F8FAFC; border-radius: var(--r20); padding: 1.4rem;
      border: 1px solid #E2E8F0; margin-bottom: 2rem; text-align: left;
    }
    .session-header {
      font-size: .78rem; font-weight: 800; text-transform: uppercase; color: var(--subtle);
      margin-bottom: .8rem; display: flex; align-items: center; justify-content: space-between;
    }
    .session-row {
      display: flex; justify-content: space-between; font-size: .88rem; font-weight: 700; color: var(--ink);
      margin-bottom: .4rem;
    }
    .session-row span:last-child { color: var(--p2); }

    /* Auto Redirect Countdown */
    .countdown-bar {
      margin-bottom: 2.2rem;
    }
    .countdown-text {
      font-size: .86rem; font-weight: 700; color: var(--muted); margin-bottom: .6rem;
    }
    .countdown-seconds {
      color: var(--p2); font-weight: 900;
    }
    .progress-track {
      height: 6px; border-radius: 3px; background: #E2E8F0; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 100%; background: linear-gradient(90deg, var(--p2), var(--c2));
      transition: width 1s linear;
    }

    /* Action Buttons */
    .btn-group {
      display: flex; gap: 1rem; flex-direction: column;
    }
    .btn-login-again {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff;
      padding: .95rem; border-radius: 50px; font-weight: 800; font-size: .98rem;
      box-shadow: 0 6px 20px rgba(91,33,182,.35); transition: transform var(--fast);
    }
    .btn-login-again:hover { transform: translateY(-2px); }

    .btn-home {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      background: transparent; color: var(--muted); border: 1.5px solid #CBD5E1;
      padding: .85rem; border-radius: 50px; font-weight: 700; font-size: .92rem;
      transition: all var(--fast);
    }
    .btn-home:hover { background: #EDE9FE; border-color: var(--p2); color: var(--p2); }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 540px) {
      .logout-card { padding: 2.5rem 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- ==================== TOP NAVBAR ==================== -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-dot"></div>
        INTERFINIX
      </a>
      <div class="nav-links">
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="login.html" class="nav-cta">Log In</a>
      </div>
    </div>
  </nav>

  <!-- ==================== LOGOUT WRAPPER ==================== -->
  <main class="logout-wrapper">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="logout-card">
      <div class="logout-icon">👋</div>

      <h1 class="logout-title">You've Been Logged Out</h1>
      <p class="logout-subtitle">
        Your test progress and analytics have been saved securely in your browser storage.
      </p>

      <!-- Session summary -->
      <div class="session-box">
        <div class="session-header">
          <span>Session Summary</span>
          <span style="color:var(--green)">✓ Securely Closed</span>
        </div>
        <div class="session-row">
          <span style="color:var(--muted)">User:</span>
          <span id="summaryUserName">Student</span>
        </div>
        <div class="session-row">
          <span style="color:var(--muted)">Target Domain:</span>
          <span id="summaryDomain">Tech Roles</span>
        </div>
      </div>

      <!-- Auto Redirect Countdown -->
      <div class="countdown-bar">
        <div class="countdown-text">
          Redirecting to home in <span class="countdown-seconds" id="countNum">5</span> seconds...
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="pFill"></div>
        </div>
      </div>

      <!-- Direct Buttons -->
      <div class="btn-group">
        <a href="login.html" class="btn-login-again">
          <span>🔑 Log In Again</span>
          <span>&rarr;</span>
        </a>
        <a href="index.html" class="btn-home">
          <span>🏠 Return to Homepage</span>
        </a>
      </div>
    </div>
  </main>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    let countdown = 5;
    let timerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
      // 1. Read existing user info for summary
      const userRaw = localStorage.getItem('interfinix_user');
      if (userRaw) {
        try {
          const user = JSON.parse(userRaw);
          document.getElementById('summaryUserName').textContent = user.name || 'Student';
          document.getElementById('summaryDomain').textContent = user.domain || 'Software Roles';
        } catch(e) {}
      }

      // 2. Safely remove active session from localStorage
      localStorage.removeItem('interfinix_user');

      // 3. Start animated countdown to redirect to index.html
      const countEl = document.getElementById('countNum');
      const fillEl = document.getElementById('pFill');

      timerInterval = setInterval(() => {
        countdown--;
        if (countEl) countEl.textContent = countdown;
        if (fillEl) fillEl.style.width = (countdown / 5 * 100) + '%';

        if (countdown <= 0) {
          clearInterval(timerInterval);
          window.location.href = 'index.html';
        }
      }, 1000);
    });
  </script>
</body>
</html>
